    }
  </style>
  <rect class="bg" width="24" height="24" rx="6" stroke-width="1"/>
  <circle cx="9" cy="12" r="2.2" class="eye"/>
  <circle cx="15" cy="12" r="2.2" class="eye"/>
  <rect x="5" y="8.5" width="14" height="7" rx="2.5" class="cody-body" stroke-width="1.8"/>
</svg>
