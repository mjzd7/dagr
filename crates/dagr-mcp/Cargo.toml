[package]
name = "dagr-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP JSON-RPC server exposing DAGR governance tools to AI coding agents (experimental A2A swarm bus behind the `a2a` feature)"

[dependencies]
dagr-core = { workspace = true }
dagr-slicer = { workspace = true }
dagr-guard = { workspace = true }
dagr-sandbox = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
# Experimental peer-to-peer swarm bus (A2A). Off by default; enable with
# `--features a2a`. See docs/HONEST-LIMITS.md before relying on it.
a2a = []
