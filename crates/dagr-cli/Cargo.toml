[package]
name = "dagr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The DAG-Native Symbolic AST Slicing Hypervisor, Safety Sandbox & A2A Swarm Bus for AI Coding Agents"

[lib]
name = "dagr_cli"
path = "src/lib.rs"

[[bin]]
name = "dagr"
path = "src/main.rs"

[dependencies]
dagr-core = { workspace = true }
dagr-slicer = { workspace = true }
dagr-guard = { workspace = true }
dagr-sandbox = { workspace = true }
dagr-mcp = { workspace = true }
glob = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.8"


