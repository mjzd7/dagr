name: Release & Binary Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Native Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: dagr-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: dagr-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: dagr-darwin-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: dagr-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p dagr

      - name: Package Binary Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/dagr.exe dist/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/dagr dist/${{ matrix.artifact_name }}
            chmod +x dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Binary Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  create-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
