name: 🔄 Sync Brand Logos from Open-Source Repositories

on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync-logos:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Run Open-Source Logo Sync Engine
        run: python3 scripts/sync_logos.py

      - name: 📝 Commit & Push Updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/icons/
          if git diff --staged --quiet; then
            echo "✅ All brand logos are already up to date with upstream repositories."
          else
            git commit -m "chore(assets): auto-sync official brand icons from open-source repositories"
            git push origin main
          fi
