name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Format & Clippy (zero-tolerance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --workspace

  t0-smoke:
    name: T0 field-protocol self-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p dagr
      - name: Install binary to PATH
        run: cargo install --path crates/dagr-cli
      - name: T0 self-smoke (env snapshot, guard, slice probe, MCP parity)
        run: bash scripts/fieldtest/run_protocol.sh . --quick

  e2e-suite:
    name: E2E comprehensive harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p dagr
      - name: Comprehensive functionality verification
        run: python3 scripts/comprehensive_test_suite.py
