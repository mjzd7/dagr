name: DAGR CI & Swarm Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Rust Quality Gate & Golden Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Code Formatting Check
        run: cargo fmt --check

      - name: Clippy Linter (Zero-Defect Enforcement)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Suite & Golden Benchmarks
        run: cargo test --workspace --verbose

      - name: Verify CLI Help & JSON Formatter
        run: |
          cargo run -p dagr -- --help
          cargo run -p dagr -- init --preset clean-architecture
          cargo run -p dagr -- guard --format json
